<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ATO Sentinel{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  {% if settings.rum_app_id and settings.rum_client_token %}
  <script
    src="https://www.datadoghq-browser-agent.com/{{ settings.dd_site.replace('.datadoghq.com', '') }}/v6/datadog-rum.js"
    defer>
  </script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (!window.DD_RUM) return;
      window.DD_RUM.init({
        applicationId: '{{ settings.rum_app_id }}',
        clientToken: '{{ settings.rum_client_token }}',
        site: '{{ settings.dd_site }}',
        service: '{{ settings.dd_service }}',
        env: '{{ settings.dd_env }}',
        sessionSampleRate: 100,
        sessionReplaySampleRate: 20,
        trackUserInteractions: true,
        defaultPrivacyLevel: 'mask-user-input',
      });
    });
  </script>
  {% endif %}
</head>
<body data-csrf-token="{{ csrf_token }}" data-csrf-cookie-name="{{ settings.csrf_cookie_name }}">
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/">ATO Sentinel</a>
      <nav class="nav">
        <a href="/mitre">MITRE</a>
        {% if current_user %}
        <a href="/account/security">Account</a>
        <a href="/analyst/detections">Analyst</a>
        <form method="post" action="/auth/logout" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="link-button" type="submit">Logout</button>
        </form>
        {% else %}
        <a href="/auth/login">Login</a>
        <a href="/auth/register">Register</a>
        {% endif %}
      </nav>
    </header>

    <main class="content">
      {% block body %}{% endblock %}
    </main>
  </div>
  <script src="https://unpkg.com/htmx.org@2.0.7" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
