{% extends "base.html" %}
{% block title %}Verify MFA{% endblock %}
{% block body %}
<section class="auth-layout">
  <div class="panel auth-panel">
    <p class="eyebrow">Step-Up Authentication</p>
    <h1>Verify your sign-in</h1>
    {% if error %}
    <p class="flash flash-error">{{ error }}</p>
    {% endif %}
    {% if requires_step_up %}
    <p class="flash flash-ok">Risk-based step-up is active for this account.</p>
    {% endif %}
    <form method="post" action="/auth/mfa/verify" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="ticket" value="{{ ticket }}">
      <label>
        <span>TOTP Code</span>
        <input name="totp_code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
      </label>
      <label>
        <span>Backup Code</span>
        <input name="backup_code" placeholder="ABCD-1234">
      </label>
      <button class="button button-primary" type="submit">Complete sign-in</button>
    </form>
  </div>
</section>
{% endblock %}
